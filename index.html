<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/src/assets/ZeeTimeRecords_Logo.png" />
  <title>Zee Time Records</title>
  <style>
    .app-loading-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box; text-align: center; background: radial-gradient(ellipse at top, #eaf1ff, #f8fafc 65%); color: #16233d; font-family: 'Segoe UI', Arial, sans-serif; }
    .app-loading-logo { width: 112px; height: 112px; object-fit: contain; margin-bottom: 24px; border-radius: 24px; box-shadow: 0 12px 32px #16233d18; }
    .app-loading-screen h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: -0.6px; }
    .app-loading-screen p { margin: 0; color: #52627a; font-size: 15px; line-height: 1.6; }
    .app-loading-screen small { margin-top: 16px; color: #64748b; font-size: 12px; }
    .app-loading-progress { width: 220px; max-width: 100%; height: 4px; background: #dce6f5; border-radius: 4px; overflow: hidden; margin-top: 28px; }
    .app-loading-progress span { display: block; height: 100%; width: 40%; background: #2f6fed; border-radius: inherit; animation: app-loading-slide 1.4s ease-in-out infinite; }
    @keyframes app-loading-slide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
    @media (prefers-reduced-motion: reduce) { .app-loading-progress span { animation: none; width: 100%; opacity: 0.65; } }
    body { margin: 0; }
  </style>
</head>

<body>
  <div id="root">
    <div class="app-loading-screen" role="status" aria-live="polite" aria-busy="true">
      <img class="app-loading-logo" src="/src/assets/ZeeTimeRecords_Logo.png" alt="" />
      <h1>Zee Time Records</h1>
      <p>Starting your app…</p>
      <div class="app-loading-progress" aria-hidden="true"><span></span></div>
      <small>Please wait while we get everything ready.</small>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
