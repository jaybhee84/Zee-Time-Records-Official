name: Auto Tag and Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - electron/**
      - src/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO 2>$null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists."
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Release $env:RELEASE_TAG does not exist."
            "exists=false" >> $env:GITHUB_OUTPUT
          }

          exit 0

      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        run: npm ci --legacy-peer-deps

      - name: Build Windows installer and update metadata
        if: steps.existing.outputs.exists != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run electron:build:win -- --publish never

      - name: Show generated release files
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          Write-Host "Generated release files:"
          Get-ChildItem -Path release -Recurse

      - name: Create GitHub Release in this repository
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          target_commitish: ${{ github.sha }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: Zee Time Records ${{ steps.version.outputs.version }}
          body: Zee Time Records v${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
